name: DogWalk rain alerts

# Checks the 15-min precipitation forecast every half hour during walk hours
# (roughly 6 AM - 10:30 PM Eastern) and pushes a heads-up to ntfy.sh when
# rain starts in ~30-55 minutes, or when current rain clears in ~30-60 min.
# The 30-min-wide alert bands mean each rain event notifies about once.

on:
  schedule:
    - cron: '*/30 10-23 * * *'   # 6:00 AM - 7:30 PM EDT
    - cron: '*/30 0-2 * * *'     # 8:00 PM - 10:30 PM EDT
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # hot/cold are each location's own feels-like comfort limits (°F) —
          # Atlantic Beach and Neptune Beach are different households (ours
          # vs. Callie's parents'), so they don't have to share one threshold.
          # Defaults match the app's own out-of-the-box ⚙ values; update
          # either pair whenever that household tells you their real limits.
          - name: Atlantic Beach
            lat: "30.34"
            lon: "-81.40"
            topic: dogwalk-atlbeach-rain-4187
            hot: "88"
            cold: "20"
          - name: Neptune Beach
            lat: "30.312"
            lon: "-81.396"
            topic: dogwalk-neptunebeach-rain-5914
            hot: "88"
            cold: "20"
    env:
      TZ: America/New_York
      LAT: ${{ matrix.lat }}
      LON: ${{ matrix.lon }}
      TOPIC: ${{ matrix.topic }}
      HOT_LIMIT: ${{ matrix.hot }}
      COLD_LIMIT: ${{ matrix.cold }}
    steps:
      # Only the nor'easter step needs the repo (it runs the detector straight out of index.html).
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            index.html
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: Check forecast and notify (${{ matrix.name }})
        run: |
          set -e
          d=$(curl -s "https://api.open-meteo.com/v1/forecast?latitude=$LAT&longitude=$LON&minutely_15=precipitation&forecast_days=1&timeformat=unixtime&timezone=America%2FNew_York")
          now=$(date +%s)
          msg=$(echo "$d" | jq -r --argjson now "$now" '
            .minutely_15 | [.time, .precipitation] | transpose
            | map({t: .[0], mm: (.[1] // 0)})
            | map(select(.t + 900 > $now))
            | .[0:48] as $slots
            | ($slots | map(.mm >= 0.1)) as $wet
            | ($wet | index(true)) as $first
            | if $first == null then empty
              elif $first == 0 then
                ($wet | index(false)) as $clr
                | if $clr != null and ($slots[$clr].t - $now) >= 1800 and ($slots[$clr].t - $now) < 3600
                  then "Clearing up around \($slots[$clr].t | strflocaltime("%I:%M %p") | ltrimstr("0")) - walk window coming"
                  else empty end
              else
                ($slots[$first].t - $now) as $secs
                | if $secs >= 1500 and $secs < 3300
                  then "Rain around \($slots[$first].t | strflocaltime("%I:%M %p") | ltrimstr("0")) - last call for a dry walk"
                  else empty end
              end')
          if [ -n "$msg" ]; then
            curl -s -H "Title: DogWalk" -H "Tags: dog" -d "$msg" "https://ntfy.sh/$TOPIC" > /dev/null
            echo "sent: $msg"
          else
            echo "no alert needed"
          fi

          # Morning storm-risk heads-up (8:00 AM run only). Deterministic
          # forecasts routinely miss FL pop-up storms entirely, so on days
          # with a meaningful probability, warn once up front.
          if [ "$(date +%H)" = "08" ] && [ "$(date +%M)" -lt 30 ]; then
            p=$(curl -s "https://api.open-meteo.com/v1/forecast?latitude=$LAT&longitude=$LON&hourly=precipitation_probability,temperature_2m,apparent_temperature,cloud_cover,is_day&forecast_days=1&temperature_unit=fahrenheit&timeformat=unixtime&timezone=America%2FNew_York")
            risk=$(echo "$p" | jq -r '
              .hourly | [.time, .precipitation_probability] | transpose
              | map({t: .[0], p: (.[1] // 0)})
              | map(select((.t | strflocaltime("%H") | tonumber) >= 6 and (.t | strflocaltime("%H") | tonumber) < 22))
              | max_by(.p)
              | if .p >= 50
                then "Storm risk today - peak \(.p)% around \(.t | strflocaltime("%I:%M %p") | ltrimstr("0")). Pop-up storms can beat the forecast; favor earlier walks."
                else empty end')
            if [ -n "$risk" ]; then
              curl -s -H "Title: DogWalk" -H "Tags: zap" -d "$risk" "https://ntfy.sh/$TOPIC" > /dev/null
              echo "sent morning risk: $risk"
            else
              echo "no morning risk alert"
            fi

            # Morning heat/pavement heads-up. Same pavement estimate as the
            # app's pavementF(): pav = air + max(0, 1.8*air-14 - air) * sun,
            # sun scaled down by cloud cover, pavement = air at night.
            # $HOT_LIMIT is this location's own feels-like comfort limit
            # (see the matrix above) — pavement's 130F danger line stays
            # fixed since it's a hazard threshold, not a per-household
            # comfort preference (the app doesn't let anyone configure it
            # either).
            heat=$(echo "$p" | jq -r --argjson hotLimit "$HOT_LIMIT" --argjson coldLimit "$COLD_LIMIT" '
              def pav(air; cloud; day):
                if day == 0 then (air | round)
                else
                  ((1.8*air - 14) - air) as $over
                  | (if $over > 0 then $over else 0 end) as $overpos
                  | (1 - ([cloud,100]|min)/100*0.75) as $sun
                  | (air + $overpos*$sun) | round
                end;
              .hourly as $h
              | [$h.time, $h.temperature_2m, $h.apparent_temperature, $h.cloud_cover, $h.is_day] | transpose
              | map({t: .[0], feels: (.[2] | round), pavv: (pav(.[1]; (.[3] // 50); .[4]))})
              | map(select((.t | strflocaltime("%H") | tonumber) >= 6 and (.t | strflocaltime("%H") | tonumber) < 20))
              | (max_by(.pavv)) as $peakPav
              | (max_by(.feels)) as $peakFeels
              | (min_by(.feels)) as $lowFeels
              | if $peakPav.pavv >= 130
                then "Pavement will hit ~\($peakPav.pavv)° around \($peakPav.t | strflocaltime("%I:%M %p") | ltrimstr("0")) today - stick to grass or walk early/late."
                elif $peakFeels.feels >= $hotLimit
                then "Feels like \($peakFeels.feels)° around \($peakFeels.t | strflocaltime("%I:%M %p") | ltrimstr("0")) today - favor an early or late walk."
                elif $lowFeels.feels <= $coldLimit
                then "Feels like \($lowFeels.feels)° around \($lowFeels.t | strflocaltime("%I:%M %p") | ltrimstr("0")) today - bundle up or wait for it to warm up."
                else empty end')
            if [ -n "$heat" ]; then
              curl -s -H "Title: DogWalk" -H "Tags: hot_face" -d "$heat" "https://ntfy.sh/$TOPIC" > /dev/null
              echo "sent morning heat: $heat"
            else
              echo "no morning heat alert"
            fi
          fi

      # Morning nor'easter heads-up (8:00 AM run only). Runs the dashboard's own detector, so it sees
      # exactly what the panel sees. Separate step + continue-on-error: a flaky feed here must never
      # fail the rain/storm/heat step above or paint the run red.
      - name: Nor'easter heads-up (${{ matrix.name }})
        continue-on-error: true
        run: |
          if [ "$(date +%H)" = "08" ] && [ "$(date +%M)" -lt 30 ]; then
            node .github/scripts/noreaster-alert.js
          else
            echo "not the 8 AM run - skipping nor'easter check"
          fi
